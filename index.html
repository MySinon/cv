<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CV — My Sinon 📄</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&family=Orbitron:wght@500;900&family=Yuji+Syuku&display=swap" rel="stylesheet" />

<style>
/* =========================================================
   RESET & VARIABLES — sama dengan main site
   ========================================================= */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --sakura: #e8d8ff;
  --pink: #ec4899;
  --purple: #7c3aed;
  --maroon: #8b1e2d;
  --navy: #1e3a8a;
  --gold: #d4af37;
  --cyan: #06b6d4;
  --green: #4ade80;
  --bg-1: #120a1f;
  --text: #f5edff;
  --text-dim: #b8a8d0;
  --gradient: linear-gradient(135deg, #8b1e2d, #ec4899, #7c3aed);
  --gradient-warm: linear-gradient(135deg, #e8d8ff, #ec4899, #8b1e2d);
  --card-bg: rgba(30, 20, 45, 0.55);
  --card-border: rgba(139, 30, 45, 0.35);
}

html { scroll-behavior: smooth; }

body {
  font-family: 'Poppins', sans-serif;
  background: var(--bg-1);
  color: var(--text);
  overflow-x: hidden;
  min-height: 100vh;
  cursor: none;
  position: relative;
  display: flex;
  flex-direction: column;
}

/* =========================================================
   BACKGROUND LAYERS — sama dengan main site
   ========================================================= */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(circle at 15% 20%, rgba(236, 72, 153, 0.22), transparent 45%),
    radial-gradient(circle at 85% 30%, rgba(124, 58, 237, 0.2), transparent 45%),
    radial-gradient(circle at 50% 90%, rgba(139, 30, 45, 0.15), transparent 50%);
  z-index: -3;
  animation: auroraShift 14s ease-in-out infinite alternate;
  pointer-events: none;
}
@keyframes auroraShift {
  0%   { transform: translate(0, 0) scale(1); filter: hue-rotate(0deg); }
  100% { transform: translate(-20px, -30px) scale(1.1); filter: hue-rotate(20deg); }
}

body::after {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(236, 72, 153, 0.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(168, 85, 247, 0.035) 1px, transparent 1px);
  background-size: 60px 60px;
  z-index: -2;
  pointer-events: none;
  mask-image: radial-gradient(circle at 50% 50%, black 30%, transparent 75%);
  -webkit-mask-image: radial-gradient(circle at 50% 50%, black 30%, transparent 75%);
}

#sakura {
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  overflow: hidden;
}

.petal {
  position: absolute;
  top: -30px;
  width: 14px;
  height: 14px;
  background: radial-gradient(circle at 30% 30%, #ffd9e2, #ffb7c5);
  border-radius: 50% 0 50% 0;
  opacity: 0.75;
  will-change: transform;
  animation: petalFall linear infinite;
  box-shadow: 0 0 8px rgba(255, 183, 197, 0.5);
}
@keyframes petalFall {
  0%   { transform: translate(0, -30px) rotate(0deg); opacity: 0; }
  10%  { opacity: 0.75; }
  90%  { opacity: 0.75; }
  100% { transform: translate(var(--drift, 60px), 105vh) rotate(720deg); opacity: 0; }
}

.jp-char {
  position: absolute;
  font-family: 'Yuji Syuku', serif;
  font-size: 3rem;
  color: rgba(236, 72, 153, 0.08);
  font-weight: 700;
  pointer-events: none;
  animation: jpFloat 20s ease-in-out infinite;
  user-select: none;
}
@keyframes jpFloat {
  0%, 100% { transform: translateY(0) rotate(-5deg); opacity: 0.08; }
  50%      { transform: translateY(-30px) rotate(5deg); opacity: 0.15; }
}

/* =========================================================
   LOADING
   ========================================================= */
#loader {
  position: fixed;
  inset: 0;
  background: var(--bg-1);
  z-index: 9999;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  transition: opacity 0.8s, visibility 0.8s;
}
#loader.hidden { opacity: 0; visibility: hidden; }
.loader-sakura {
  font-size: 4rem;
  animation: spinPulse 1.5s ease-in-out infinite;
  filter: drop-shadow(0 0 20px var(--pink));
}
@keyframes spinPulse {
  0%, 100% { transform: scale(1) rotate(0deg); }
  50%      { transform: scale(1.3) rotate(180deg); }
}
.loader-text {
  margin-top: 24px;
  font-family: 'Yuji Syuku', serif;
  letter-spacing: 8px;
  font-size: 1rem;
  color: var(--sakura);
  text-shadow: 0 0 12px var(--pink);
  animation: pulse 1.5s ease infinite;
}
@keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.4;} }

/* =========================================================
   CUSTOM CURSOR
   ========================================================= */
.cursor-dot, .cursor-ring {
  position: fixed;
  pointer-events: none;
  z-index: 10000;
  border-radius: 50%;
  top: 0; left: 0;
  transform: translate(-50%, -50%);
}
.cursor-dot {
  width: 6px; height: 6px;
  background: var(--sakura);
  box-shadow: 0 0 10px var(--pink);
}
.cursor-ring {
  width: 38px; height: 38px;
  border: 1.5px solid var(--pink);
  transition: width 0.25s, height 0.25s, border-color 0.25s, background 0.25s;
  box-shadow: 0 0 20px rgba(236, 72, 153, 0.7);
}
.cursor-ring.hover {
  width: 60px; height: 60px;
  background: rgba(236, 72, 153, 0.15);
  border-color: var(--cyan);
  box-shadow: 0 0 30px rgba(6, 182, 212, 0.8);
}

/* =========================================================
   NAVBAR
   ========================================================= */
.navbar {
  position: fixed;
  top: 0; left: 0; right: 0;
  padding: 18px 6vw;
  display: flex;
  justify-content: space-between;
  align-items: center;
  z-index: 100;
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  background: rgba(18, 10, 31, 0.55);
  border-bottom: 1px solid rgba(236, 72, 153, 0.15);
  animation: slideDown 0.8s ease both;
}
@keyframes slideDown {
  from { opacity: 0; transform: translateY(-20px); }
  to   { opacity: 1; transform: translateY(0); }
}

.back-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: var(--sakura);
  text-decoration: none;
  font-size: 0.9rem;
  font-weight: 500;
  padding: 8px 16px;
  border-radius: 50px;
  border: 1px solid rgba(236, 72, 153, 0.4);
  background: rgba(236, 72, 153, 0.08);
  transition: all 0.3s;
  cursor: none;
}
.back-btn:hover {
  background: rgba(236, 72, 153, 0.2);
  box-shadow: 0 0 20px rgba(236, 72, 153, 0.5);
  transform: translateX(-3px);
}
.logo {
  font-family: 'Yuji Syuku', serif;
  font-weight: 700;
  font-size: 1.5rem;
  letter-spacing: 3px;
  color: var(--sakura);
  text-shadow: 0 0 20px var(--pink);
}
.logo span {
  background: var(--gradient-warm);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.nav-right {
  display: flex;
  align-items: center;
  gap: 1.5rem;
}

/* Music toggle button */
.music-btn {
  width: 42px; height: 42px;
  border-radius: 50%;
  border: 1.5px solid rgba(236, 72, 153, 0.5);
  background: rgba(236, 72, 153, 0.1);
  color: var(--sakura);
  cursor: none;
  display: grid;
  place-items: center;
  font-size: 1.1rem;
  transition: all 0.3s;
  position: relative;
  overflow: hidden;
}
.music-btn:hover {
  background: rgba(236, 72, 153, 0.25);
  box-shadow: 0 0 20px rgba(236, 72, 153, 0.6);
  transform: scale(1.1);
}
.music-btn.playing {
  border-color: var(--gold);
  color: var(--gold);
  box-shadow: 0 0 25px rgba(212, 175, 55, 0.7);
  animation: musicPulse 1s ease-in-out infinite;
}
@keyframes musicPulse {
  0%, 100% { box-shadow: 0 0 25px rgba(212, 175, 55, 0.7); }
  50%      { box-shadow: 0 0 40px rgba(212, 175, 55, 1); }
}
.eq-bars {
  display: flex;
  align-items: flex-end;
  gap: 2px;
  height: 16px;
}
.eq-bars span {
  width: 3px;
  background: currentColor;
  border-radius: 2px;
  animation: eq 0.9s ease-in-out infinite;
}
.eq-bars span:nth-child(1) { height: 60%; animation-delay: 0s; }
.eq-bars span:nth-child(2) { height: 100%; animation-delay: 0.2s; }
.eq-bars span:nth-child(3) { height: 70%; animation-delay: 0.4s; }
.eq-bars span:nth-child(4) { height: 90%; animation-delay: 0.1s; }
@keyframes eq {
  0%, 100% { transform: scaleY(0.4); }
  50%      { transform: scaleY(1); }
}
.music-btn:not(.playing) .eq-bars span { animation-play-state: paused; transform: scaleY(0.3); }

/* =========================================================
   MAIN WRAPPER
   ========================================================= */
.main-wrap {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 120px 5vw 60px;
  position: relative;
}

.container {
  max-width: 720px;
  width: 100%;
  text-align: center;
}

/* =========================================================
   PROFILE — hero
   ========================================================= */
.profile {
  margin-bottom: 48px;
  animation: fadeInUp 0.8s ease both;
}

.avatar-wrap {
  position: relative;
  width: 140px;
  height: 140px;
  margin: 0 auto 24px;
  animation: charFloat 4s ease-in-out infinite;
}
@keyframes charFloat {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-10px); }
}

.avatar {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  background: var(--gradient);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 4rem;
  box-shadow: 0 8px 40px rgba(236, 72, 153, 0.55),
              0 0 80px rgba(139, 30, 45, 0.3),
              inset 0 -6px 0 rgba(0,0,0,0.2);
  position: relative;
  z-index: 1;
  overflow: hidden;
}
.avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 50%;
}

/* Ring aura */
.avatar-wrap::before {
  content: '';
  position: absolute;
  inset: -12px;
  border-radius: 50%;
  border: 2px solid rgba(236, 72, 153, 0.3);
  animation: ringPulse 3s ease-in-out infinite;
}
.avatar-wrap::after {
  content: '';
  position: absolute;
  inset: -6px;
  border-radius: 50%;
  border: 1px dashed rgba(168, 85, 247, 0.4);
  animation: ringRotate 12s linear infinite;
}
@keyframes ringPulse {
  0%, 100% { transform: scale(1); opacity: 0.6; }
  50%      { transform: scale(1.06); opacity: 0.2; }
}
@keyframes ringRotate {
  to { transform: rotate(360deg); }
}

.profile .greeting {
  color: var(--cyan);
  font-family: 'Yuji Syuku', serif;
  font-size: 0.9rem;
  letter-spacing: 8px;
  text-transform: uppercase;
  margin-bottom: 12px;
  text-shadow: 0 0 16px var(--cyan);
  opacity: 0;
  animation: fadeInUp 0.8s ease 0.2s forwards;
}

.profile h1 {
  font-family: 'Orbitron', sans-serif;
  font-size: clamp(1.8rem, 5.5vw, 3rem);
  font-weight: 900;
  letter-spacing: -1px;
  line-height: 1.1;
  margin-bottom: 16px;
  text-shadow: 0 0 40px rgba(236, 72, 153, 0.5);
  opacity: 0;
  animation: fadeInUp 0.8s ease 0.35s forwards;
}
.profile h1 .gradient-text {
  background: linear-gradient(135deg, #e8d8ff, #ec4899, #8b1e2d, #ec4899, #e8d8ff);
  background-size: 300% 300%;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  animation: gradientShift 5s ease infinite;
}
@keyframes gradientShift {
  0%   { background-position: 0% 50%; }
  50%  { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

.profile .tagline {
  color: var(--text-dim);
  font-size: 0.95rem;
  letter-spacing: 0.5px;
  opacity: 0;
  animation: fadeInUp 0.8s ease 0.5s forwards;
}
.profile .tagline .dot {
  color: var(--pink);
  margin: 0 8px;
  text-shadow: 0 0 10px var(--pink);
}

/* =========================================================
   MENU GRID — style dari main site
   ========================================================= */
.menu-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 22px;
  perspective: 1200px;
  margin-bottom: 40px;
}

.menu-card {
  position: relative;
  padding: 34px 26px;
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: 22px;
  cursor: none;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  overflow: hidden;
  transform-style: preserve-3d;
  transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1),
              border-color 0.4s, box-shadow 0.4s;
  opacity: 0;
  animation: cardReveal 0.7s ease forwards;
  text-decoration: none;
  color: inherit;
  display: block;
  text-align: left;
}
.menu-card:nth-child(1) { animation-delay: 0.6s; }
.menu-card:nth-child(2) { animation-delay: 0.75s; }

@keyframes cardReveal {
  from { opacity: 0; transform: translateY(40px) rotateX(-15deg); }
  to   { opacity: 1; transform: translateY(0) rotateX(0); }
}
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(30px); }
  to   { opacity: 1; transform: translateY(0); }
}

.menu-card:hover {
  border-color: rgba(236, 72, 153, 0.7);
  box-shadow: 0 30px 60px rgba(236, 72, 153, 0.35),
              0 0 60px rgba(124, 58, 237, 0.25);
}
.menu-card::after {
  content: '';
  position: absolute;
  top: 10px; right: 10px;
  width: 24px; height: 24px;
  border-top: 2px solid var(--pink);
  border-right: 2px solid var(--pink);
  opacity: 0.5;
  transition: all 0.3s;
}
.menu-card:hover::after {
  top: 6px; right: 6px;
  opacity: 1;
  box-shadow: 0 0 10px var(--pink);
}
.card-glow {
  position: absolute;
  top: -50%; left: -50%;
  width: 200%; height: 200%;
  background: radial-gradient(circle, rgba(236, 72, 153, 0.35), transparent 55%);
  opacity: 0;
  transition: opacity 0.5s;
  pointer-events: none;
}
.menu-card:hover .card-glow { opacity: 1; }

.card-icon {
  font-size: 2.8rem;
  margin-bottom: 1rem;
  display: inline-block;
  transition: transform 0.4s;
  filter: drop-shadow(0 0 10px rgba(236, 72, 153, 0.7));
}
.menu-card:hover .card-icon {
  transform: scale(1.25) rotate(-10deg);
}
.menu-card h3 {
  font-family: 'Orbitron', sans-serif;
  font-size: 1.05rem;
  margin-bottom: 0.6rem;
  font-weight: 700;
  letter-spacing: 2px;
}
.menu-card p {
  color: var(--text-dim);
  font-size: 0.9rem;
  line-height: 1.6;
}

/* Card khusus download — aksen cyan */
.menu-card.download .card-icon {
  filter: drop-shadow(0 0 10px rgba(6, 182, 212, 0.7));
}
.menu-card.download:hover {
  border-color: rgba(6, 182, 212, 0.7);
  box-shadow: 0 30px 60px rgba(6, 182, 212, 0.3),
              0 0 60px rgba(6, 182, 212, 0.2);
}
.menu-card.download:hover::after {
  border-color: var(--cyan);
  box-shadow: 0 0 10px var(--cyan);
}
.menu-card.download .card-glow {
  background: radial-gradient(circle, rgba(6, 182, 212, 0.3), transparent 55%);
}

/* Arrow */
.card-arrow {
  position: absolute;
  bottom: 20px;
  right: 24px;
  font-size: 1.2rem;
  color: var(--pink);
  opacity: 0.5;
  transition: all 0.3s;
}
.menu-card:hover .card-arrow {
  opacity: 1;
  transform: translate(4px, -4px);
  text-shadow: 0 0 12px var(--pink);
}
.menu-card.download .card-arrow {
  color: var(--cyan);
}
.menu-card.download:hover .card-arrow {
  text-shadow: 0 0 12px var(--cyan);
}

/* =========================================================
   BOTTOM HINT
   ========================================================= */
.bottom-hint {
  color: var(--text-dim);
  font-size: 0.82rem;
  letter-spacing: 1px;
  opacity: 0;
  animation: fadeInUp 0.8s ease 1s forwards;
}
.bottom-hint .jp {
  font-family: 'Yuji Syuku', serif;
  color: var(--sakura);
  letter-spacing: 4px;
}

/* =========================================================
   FOOTER
   ========================================================= */
.footer {
  text-align: center;
  padding: 30px 20px;
  color: var(--text-dim);
  font-size: 0.85rem;
  border-top: 1px solid rgba(236, 72, 153, 0.15);
  letter-spacing: 1px;
}
.footer .jp {
  font-family: 'Yuji Syuku', serif;
  color: var(--sakura);
  letter-spacing: 4px;
  margin-bottom: 6px;
}

/* =========================================================
   RESPONSIVE
   ========================================================= */
@media (max-width: 640px) {
  body { cursor: auto; }
  .cursor-dot, .cursor-ring { display: none; }
  .navbar { padding: 14px 5vw; }
  .logo { font-size: 1.2rem; }
  .back-btn { font-size: 0.8rem; padding: 6px 12px; }
  .music-btn { width: 38px; height: 38px; }
  .main-wrap { padding: 100px 5vw 40px; }
  .menu-grid { grid-template-columns: 1fr; gap: 16px; }
  .menu-card { padding: 28px 22px; cursor: pointer; }
  .avatar-wrap { width: 110px; height: 110px; }
  .avatar { font-size: 3rem; }
  .profile { margin-bottom: 36px; }
  .jp-char { font-size: 1.8rem; }
  .petal { width: 10px; height: 10px; animation-duration: 20s !important; }
  .menu-card { cursor: pointer; }
  .back-btn, .music-btn { cursor: pointer; }
}
</style>
</head>
<body>

<!-- LOADER -->
<div id="loader">
  <div class="loader-sakura">🌸</div>
  <p class="loader-text">読み込み中...</p>
</div>

<!-- CURSOR -->
<div class="cursor-dot" id="cursorDot"></div>
<div class="cursor-ring" id="cursorRing"></div>

<!-- SAKURA -->
<div id="sakura"></div>

<!-- ============ NAVBAR ============ -->
<nav class="navbar">
  <a href="https://my-sinon.my.id" class="back-btn">← Kembali</a>
  <div class="nav-right">
    <div class="logo">My<span>Sinon</span></div>
    <button class="music-btn" id="musicBtn" title="Play / Pause BGM" aria-label="Toggle Music">
      <span class="eq-bars">
        <span></span><span></span><span></span><span></span>
      </span>
    </button>
  </div>
</nav>

<!-- ============ MAIN ============ -->
<main class="main-wrap">
  <div class="container">

    <!-- PROFILE -->
    <div class="profile">
      <div class="avatar-wrap">
        <div class="avatar">👤</div>
        <!-- Ganti 👤 dengan: <img src="img/avatar.jpg" alt="My Sinon"> -->
      </div>
      <p class="greeting">ようこそ — Welcome</p>
      <h1>Curriculum <span class="gradient-text">Vitae</span></h1>
      <p class="tagline">
        Teknisi <span class="dot">•</span> Developer <span class="dot">•</span> Pekerja Keras
      </p>
    </div>

    <!-- MENU -->
    <div class="menu-grid">

      <!-- Download CV -->
      <a class="menu-card download" href="file/CV-Rizqi-MuhammadFajar.pdf" download="CV-Rizqi-MuhammadFajar.pdf">
        <div class="card-icon">📄</div>
        <h3>DOWNLOAD CV</h3>
        <p>Unduh versi PDF</p>
        <span class="card-arrow">⬇</span>
        <div class="card-glow"></div>
      </a>

      <!-- Lihat Portofolio -->
      <a class="menu-card" href="portofolio/">
        <div class="card-icon">📁</div>
        <h3>LIHAT PORTOFOLIO</h3>
        <p>Jelajahi karya, skill, dan pengalaman aku!</p>
        <span class="card-arrow">↗</span>
        <div class="card-glow"></div>
      </a>

    </div>

    <!-- BOTTOM HINT -->
    <p class="bottom-hint">
      <span class="jp">ありがとう ございます</span>
    </p>

  </div>
</main>

<!-- ============ FOOTER ============ -->
<footer class="footer">
  <p class="jp">私の履歴書</p>
  <p>© 2026 My Sinon — cv.my-sinon.my.id — Made with 💜🌸</p>
</footer>

<script>
/* =========================================================
   LOADER
   ========================================================= */
window.addEventListener('load', () => {
  setTimeout(() => document.getElementById('loader').classList.add('hidden'), 700);
});

/* =========================================================
   CUSTOM CURSOR
   ========================================================= */
(function initCursor() {
  const dot = document.getElementById('cursorDot');
  const ring = document.getElementById('cursorRing');
  let mx = 0, my = 0, rx = 0, ry = 0;

  document.addEventListener('mousemove', (e) => {
    mx = e.clientX; my = e.clientY;
    dot.style.transform = `translate(${mx}px, ${my}px) translate(-50%, -50%)`;
  });

  function animRing() {
    rx += (mx - rx) * 0.15;
    ry += (my - ry) * 0.15;
    ring.style.transform = `translate(${rx}px, ${ry}px) translate(-50%, -50%)`;
    requestAnimationFrame(animRing);
  }
  animRing();

  document.querySelectorAll('a, button, .menu-card')
    .forEach(el => {
      el.addEventListener('mouseenter', () => ring.classList.add('hover'));
      el.addEventListener('mouseleave', () => ring.classList.remove('hover'));
    });
})();

/* =========================================================
   SAKURA PETALS + JP CHARS
   ========================================================= */
(function initSakura() {
  const container = document.getElementById('sakura');
  const isMobile = window.innerWidth < 768;
  const petalCount = isMobile ? 12 : 22;

  for (let i = 0; i < petalCount; i++) {
    const petal = document.createElement('div');
    petal.className = 'petal';
    petal.style.left = Math.random() * 100 + 'vw';
    petal.style.animationDuration = (10 + Math.random() * 8) + 's';
    petal.style.animationDelay = Math.random() * 10 + 's';
    petal.style.setProperty('--drift', (Math.random() * 120 - 40) + 'px');
    petal.style.transform = `rotate(${Math.random() * 360}deg)`;
    if (Math.random() > 0.5) {
      petal.style.background = 'radial-gradient(circle at 30% 30%, #e0d0ff, #a855f7)';
    }
    container.appendChild(petal);
  }

  const jpChars = ['履', '歴', '書', '夢', '愛', '光', '武', '忍', '星', '花'];
  const jpCount = isMobile ? 4 : 8;
  for (let i = 0; i < jpCount; i++) {
    const el = document.createElement('div');
    el.className = 'jp-char';
    el.textContent = jpChars[Math.floor(Math.random() * jpChars.length)];
    el.style.left = Math.random() * 90 + 'vw';
    el.style.top = Math.random() * 90 + 'vh';
    el.style.animationDelay = Math.random() * 10 + 's';
    el.style.animationDuration = (15 + Math.random() * 10) + 's';
    container.appendChild(el);
  }
})();

/* =========================================================
   3D TILT ON CARDS
   ========================================================= */
if (window.innerWidth > 768) {
  document.querySelectorAll('.menu-card').forEach((card) => {
    card.addEventListener('mousemove', (e) => {
      const r = card.getBoundingClientRect();
      const x = e.clientX - r.left;
      const y = e.clientY - r.top;
      const rx = ((y / r.height) - 0.5) * -18;
      const ry = ((x / r.width) - 0.5) * 18;
      card.style.transform = `perspective(1000px) rotateX(${rx}deg) rotateY(${ry}deg) translateY(-8px) scale(1.03)`;
    });
    card.addEventListener('mouseleave', () => { card.style.transform = ''; });
  });
}

/* =========================================================
   🎵 MUSIC — Web Audio API (sama dengan main site)
   ========================================================= */
(function initMusic() {
  const btn = document.getElementById('musicBtn');
  let ctx = null;
  let masterGain = null;
  let delayNode = null;
  let isPlaying = false;
  let loopTimer = null;

  const N = {
    'A3': 220.00, 'B3': 246.94, 'C4': 261.63, 'D4': 293.66,
    'E4': 329.63, 'F4': 349.23, 'G4': 392.00, 'A4': 440.00,
    'B4': 493.88, 'C5': 523.25, 'D5': 587.33, 'E5': 659.25,
    'F5': 698.46, 'G5': 783.99, 'A5': 880.00,
    'F3': 174.61, 'G3': 196.00, 'A2': 110.00, 'C3': 130.81,
    'E3': 164.81, 'F2': 87.31, 'G2': 98.00,
  };

  const CHORDS = [
    { notes: ['A3', 'C4', 'E4'], bass: 'A2' },
    { notes: ['F3', 'A3', 'C4'], bass: 'F2' },
    { notes: ['C4', 'E4', 'G4'], bass: 'C3' },
    { notes: ['G3', 'B3', 'D4'], bass: 'G2' },
  ];

  const MELODY = [
    'E5', 'D5', 'C5', 'E5',
    'G5', 'E5', 'D5', 'C5',
    'A4', 'C5', 'D5', 'E5',
    'D5', 'C5', 'A4', 'G4'
  ];

  const TEMPO = 0.5;
  const BAR_DUR = 8;

  function playNote(freq, startTime, duration, type, vol) {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.value = freq;

    gain.gain.setValueAtTime(0, startTime);
    gain.gain.linearRampToValueAtTime(vol, startTime + 0.02);
    gain.gain.exponentialRampToValueAtTime(vol * 0.6, startTime + duration * 0.3);
    gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);

    osc.connect(gain);
    gain.connect(masterGain);

    if (freq > 400 && delayNode) {
      gain.connect(delayNode);
    }

    osc.start(startTime);
    osc.stop(startTime + duration + 0.05);
  }

  function scheduleBar(startTime) {
    CHORDS.forEach((chord, ci) => {
      const cs = startTime + ci * 2;
      chord.notes.forEach((n, ni) => {
        playNote(N[n], cs + ni * 0.15, 1.8, 'triangle', 0.10);
        playNote(N[n] * 2, cs + ni * 0.15, 1.2, 'sine', 0.03);
      });
      playNote(N[chord.bass], cs, 1.9, 'sine', 0.18);
    });

    MELODY.forEach((n, i) => {
      const t = startTime + i * TEMPO;
      playNote(N[n], t, 0.45, 'triangle', 0.09);
      playNote(N[n] * 2, t + 0.05, 0.3, 'sine', 0.025);
    });
  }

  function loop() {
    if (!isPlaying) return;
    const now = ctx.currentTime + 0.1;
    scheduleBar(now);
    loopTimer = setTimeout(loop, BAR_DUR * 1000 - 100);
  }

  function initAudio() {
    ctx = new (window.AudioContext || window.webkitAudioContext)();

    masterGain = ctx.createGain();
    masterGain.gain.value = 0.6;
    masterGain.connect(ctx.destination);

    delayNode = ctx.createDelay(1);
    delayNode.delayTime.value = 0.4;
    const fb = ctx.createGain();
    fb.gain.value = 0.3;
    const wet = ctx.createGain();
    wet.gain.value = 0.35;

    delayNode.connect(fb);
    fb.connect(delayNode);
    delayNode.connect(wet);
    wet.connect(masterGain);
  }

  function startMusic() {
    if (!ctx) initAudio();
    if (ctx.state === 'suspended') ctx.resume();
    isPlaying = true;
    btn.classList.add('playing');
    loop();
  }

  function stopMusic() {
    isPlaying = false;
    btn.classList.remove('playing');
    clearTimeout(loopTimer);
    if (masterGain) {
      const now = ctx.currentTime;
      masterGain.gain.cancelScheduledValues(now);
      masterGain.gain.setValueAtTime(masterGain.gain.value, now);
      masterGain.gain.linearRampToValueAtTime(0.0001, now + 0.4);
      setTimeout(() => {
        if (!isPlaying && masterGain) masterGain.gain.value = 0.6;
      }, 500);
    }
  }

  btn.addEventListener('click', () => {
    if (isPlaying) stopMusic();
    else startMusic();
  });

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && ctx && isPlaying && ctx.state === 'suspended') {
      ctx.resume();
    }
  });
})();
</script>
